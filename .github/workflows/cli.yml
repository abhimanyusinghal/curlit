name: CLI CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:cli
      - name: Run the sample collection
        run: node examples/ci/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-reports-${{ matrix.os }}
          path: test-results/cli-example/
